<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Inteligente</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family: Arial;
            background:#f4f6f9;
            padding:30px;
        }

        h1{
            color:#333;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:15px;
            width:250px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h2{
            margin:0;
            color:#666;
        }

        .card h3{
            font-size:32px;
            color:#111;
        }

        .grafica-container{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
            margin-bottom:30px;
        }

        .ia-container{
            background:#111827;
            color:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.2);
        }

        .ia-container h2{
            color:#60a5fa;
        }

        .ia-texto{
            margin-top:15px;
            line-height:1.8;
            font-size:16px;
        }

    </style>

</head>

<body>

    <h1>📊 Dashboard Inteligente - ServiTech Manager</h1>

    <div class="container">

        <div class="card">
            <h2>Total Clientes</h2>
            <h3>{{ total_clientes }}</h3>
        </div>

        <div class="card">
            <h2>Total Órdenes</h2>
            <h3>{{ total_ordenes }}</h3>
        </div>

        <div class="card">
            <h2>Ingresos Totales</h2>
            <h3>Bs {{ ingresos }}</h3>
        </div>

    </div>

    <div class="grafica-container">

        <h2>📈 Servicios Más Solicitados</h2>

        <canvas id="grafica"></canvas>

    </div>

    <div class="ia-container">

        <h2>🤖 Análisis Inteligente con IA</h2>

        <div class="ia-texto">
            {{ analisis_ia }}
        </div>

    </div>

    <script>

        const ctx = document.getElementById('grafica');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ labels | tojson }},
                datasets: [{
                    label: 'Cantidad de servicios',
                    data: {{ valores | tojson }},
                    borderWidth:  1
                }]
            },
            options: {
                responsive:true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

    </script>

</body>
</html>
