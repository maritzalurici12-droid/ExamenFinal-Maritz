<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            font-family: Arial;
            padding: 20px;
        }

        .card{
            border:1px solid #ccc;
            padding:20px;
            margin:10px;
            border-radius:10px;
            width:250px;
            display:inline-block;
        }
    </style>
</head>
<body>

    <h1>Dashboard de Reportes</h1>

    <div class="card">
        <h2>Total Clientes</h2>
        <h3>{{ total_clientes }}</h3>
    </div>

    <div class="card">
        <h2>Total Órdenes</h2>
        <h3>{{ total_ordenes }}</h3>
    </div>

    <div class="card">
        <h2>Ingresos Totales</h2>
        <h3>Bs {{ ingresos }}</h3>
    </div>

    <hr>

    <h2>Servicios Más Solicitados</h2>

    <canvas id="grafica"></canvas>

    <script>
        const ctx = document.getElementById('grafica');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ labels | tojson }},
                datasets: [{
                    label: 'Cantidad de servicios',
                    data: {{ valores | tojson }},
                    borderWidth: 1
                }]
            },
            options: {
                responsive:true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

</body>
</html>
