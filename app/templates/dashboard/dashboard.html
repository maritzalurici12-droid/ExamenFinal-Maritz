<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>ServiTech Manager Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:#eef2f7;
            padding:40px;
            color:#1e293b;
        }

        .titulo{
            margin-bottom:35px;
        }

        .titulo h1{
            font-size:40px;
            color:#0f172a;
            margin-bottom:10px;
        }

        .titulo p{
            color:#64748b;
            font-size:18px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
            margin-bottom:40px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0px 8px 20px rgba(0,0,0,0.08);
            transition:0.3s;
            position:relative;
            overflow:hidden;
        }

        .card:hover{
            transform:translateY(-6px);
        }

        .card::before{
            content:"";
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:6px;
        }

        .clientes::before{
            background:#3b82f6;
        }

        .ordenes::before{
            background:#10b981;
        }

        .ingresos::before{
            background:#f59e0b;
        }

        .card h2{
            font-size:18px;
            color:#64748b;
            margin-bottom:15px;
        }

        .card h3{
            font-size:38px;
            color:#0f172a;
        }

        .panel{
            background:white;
            border-radius:20px;
            padding:35px;
            box-shadow:0px 8px 20px rgba(0,0,0,0.08);
            margin-bottom:35px;
        }

        .panel h2{
            margin-bottom:25px;
            color:#0f172a;
        }

        .ia-panel{
            background:linear-gradient(135deg,#0f172a,#1e3a8a);
            color:white;
        }

        .ia-panel h2{
            color:white;
        }

        .ia-texto{
            line-height:1.9;
            font-size:17px;
            color:#e2e8f0;
        }

        canvas{
            max-height:400px;
        }

    </style>

</head>

<body>

    <div class="titulo">

        <h1>ServiTech Manager</h1>

        <p>Panel inteligente de análisis y reportes</p>

    </div>

    <div class="cards">

        <div class="card clientes">

            <h2>Total Clientes</h2>

            <h3>{{ total_clientes }}</h3>

        </div>

        <div class="card ordenes">

            <h2>Total Órdenes</h2>

            <h3>{{ total_ordenes }}</h3>

        </div>

        <div class="card ingresos">

            <h2>Ingresos Totales</h2>

            <h3>Bs {{ ingresos }}</h3>

        </div>

    </div>

    <div class="panel">

        <h2>Servicios Más Solicitados</h2>

        <canvas id="grafica"></canvas>

    </div>

    <div class="panel ia-panel">

        <h2>Análisis Inteligente</h2>

        <div class="ia-texto">

            {{ analisis_ia }}

        </div>

    </div>

    <script>

        const ctx = document.getElementById('grafica');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ labels | tojson }},
                datasets: [{
                    label: 'Cantidad de Servicios',
                    data: {{ valores | tojson }},
                    backgroundColor: [
                        '#3b82f6',
                        '#10b981',
                        '#f59e0b',
                        '#ef4444',
                        '#8b5cf6'
                    ],
                    borderRadius: 8,
                    borderWidth: 1
                }]
            },

            options: {
                responsive:true,

                plugins: {
                    legend: {
                        labels: {
                            color:'#1e293b'
                        }
                    }
                },

                scales: {
                    y: {
                        beginAtZero:true,
                        ticks:{
                            color:'#64748b'
                        }
                    },

                    x: {
                        ticks:{
                            color:'#64748b'
                        }
                    }
                }
            }
        });

    </script>

</body>

</html>
